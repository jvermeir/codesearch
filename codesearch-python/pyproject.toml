[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "codesearch"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "rapidfuzz>=3.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
local = ["sentence-transformers>=2.0"]
openai = ["openai>=1.0"]
all = ["sentence-transformers>=2.0", "openai>=1.0"]

[project.scripts]
codesearch = "codesearch.cli:main"
