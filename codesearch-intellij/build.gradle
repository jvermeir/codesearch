plugins {
    id 'org.jetbrains.intellij' version '1.17.3'
    id 'java'
    id 'org.jetbrains.kotlin.jvm' version '2.0.0'
}

group 'dev.codesearch'
version '0.1.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib"
}

intellij {
    version.set("2024.1")
}

tasks.register('wrapper', Wrapper) {
    gradleVersion = '8.10.2'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

kotlin {
    jvmToolchain(21)
}

tasks {
    signPlugin {
        enabled = false
    }

    publishPlugin {
        enabled = false
    }

    patchPluginXml {
        changeNotes.set("""
            Initial release with search-only functionality.
        """)
        sinceBuild.set("241")
        untilBuild.set("")
    }
}
